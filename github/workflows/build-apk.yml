name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Site ka poora link (https://...)"
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<h2>Internet connection nahi hai</h2>' > www/index.html
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.drchouhan.clinic',appName:'Dr Chouhan Clinic',webDir:'www',server:{url:process.env.APP_URL}}))"
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicPro-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
